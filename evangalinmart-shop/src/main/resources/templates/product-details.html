<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - Evangalinmart'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container product-details">
    <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty()} ? ${product.imageUrl} : 'https://via.placeholder.com/400x300?text=Evangalinmart'"
         alt="Product image" class="product-detail-img">

    <div class="product-info">
        <h2 th:text="${product.name}"></h2>
        <p class="category" th:text="${product.category}"></p>
        <p class="price" th:text="'₹' + ${product.price}"></p>
        <p th:text="${product.description}"></p>
        <p th:if="${product.stockQuantity > 0}" class="in-stock" th:text="${product.stockQuantity} + ' in stock'"></p>
        <p th:if="${product.stockQuantity == 0}" class="stock">Out of stock</p>

        <form th:action="@{/cart/add}" method="post" th:if="${product.stockQuantity > 0}">
            <input type="hidden" name="productId" th:value="${product.id}">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1" th:max="${product.stockQuantity}">
            <button type="submit">Add to Cart</button>
        </form>
    </div>
</div>

</body>
</html>
