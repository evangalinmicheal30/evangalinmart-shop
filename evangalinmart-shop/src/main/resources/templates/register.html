<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Evangalinmart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-container">
        <h1>Evangalinmart</h1>
        <h2>Create Account</h2>

        <p class="error-msg" th:if="${emailError}" th:text="${emailError}"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Enter your full name" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" placeholder="10-digit phone number" required>
            <span class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>

            <label for="address">Address</label>
            <textarea id="address" th:field="*{address}" placeholder="Street, city, state, PIN code" required></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" required>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Minimum 6 characters" required>
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

            <button type="submit">Register</button>
        </form>

        <p class="switch-link">Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</body>
</html>
