<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - Evangalinmart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <h2>Your Cart</h2>

    <p class="error-msg" th:if="${checkoutError}" th:text="${checkoutError}"></p>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p>Your cart is empty. <a th:href="@{/}">Continue shopping</a>.</p>
    </div>

    <table class="cart-table" th:unless="${#lists.isEmpty(cartItems)}">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.product.name}"></td>
                <td th:text="'₹' + ${item.product.price}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" class="inline-form">
                        <input type="hidden" name="cartItemId" th:value="${item.id}">
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                               th:max="${item.product.stockQuantity}">
                        <button type="submit">Update</button>
                    </form>
                </td>
                <td th:text="'₹' + ${item.subtotal}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post" class="inline-form">
                        <input type="hidden" name="cartItemId" th:value="${item.id}">
                        <button type="submit" class="link-button">Remove</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <h3 th:unless="${#lists.isEmpty(cartItems)}" th:text="'Total: ₹' + ${total}"></h3>

    <form th:action="@{/cart/checkout}" method="post" th:unless="${#lists.isEmpty(cartItems)}" class="checkout-form">
        <label for="deliveryAddress">Delivery Address</label>
        <textarea id="deliveryAddress" name="deliveryAddress" required th:text="${user.address}"></textarea>
        <button type="submit">Place Order</button>
    </form>
</div>

</body>
</html>
