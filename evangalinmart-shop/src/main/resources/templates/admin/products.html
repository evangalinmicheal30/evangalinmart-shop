<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Products - Evangalinmart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <h2>Manage Products</h2>
    <a th:href="@{/admin/products/new}" class="button-link">+ Add New Product</a>

    <table class="cart-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.category}"></td>
                <td th:text="'₹' + ${product.price}"></td>
                <td th:text="${product.stockQuantity}"></td>
                <td>
                    <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}" method="post" class="inline-form">
                        <button type="submit" class="link-button">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
