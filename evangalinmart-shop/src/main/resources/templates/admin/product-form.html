<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Form - Evangalinmart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <h2 th:if="${product.id == null}">Add Product</h2>
    <h2 th:if="${product.id != null}">Edit Product</h2>

    <form th:action="@{/admin/products/save}" th:object="${product}" method="post" class="auth-container">
        <input type="hidden" th:field="*{id}">

        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" required>
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

        <label for="category">Category</label>
        <input type="text" id="category" th:field="*{category}" required>
        <span class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}"></textarea>

        <label for="price">Price (₹)</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" required>
        <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>

        <label for="stockQuantity">Stock Quantity</label>
        <input type="number" id="stockQuantity" th:field="*{stockQuantity}" required>
        <span class="field-error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></span>

        <label for="imageUrl">Image URL</label>
        <input type="text" id="imageUrl" th:field="*{imageUrl}" placeholder="https://...">

        <button type="submit">Save Product</button>
    </form>
</div>

</body>
</html>
