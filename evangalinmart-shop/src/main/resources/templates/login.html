<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Evangalinmart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-container">
        <h1>Evangalinmart</h1>
        <h2>Login</h2>

        <p class="success-msg" th:if="${param.registered}">Registration successful. Please log in.</p>
        <p class="error-msg" th:if="${param.error}">Invalid email or password.</p>
        <p class="success-msg" th:if="${param.logout}">You have been logged out.</p>

        <form th:action="@{/login}" method="post">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p class="switch-link">Don't have an account? <a th:href="@{/register}">Register here</a></p>
    </div>
</body>
</html>
