<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders - Evangalinmart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <h2>My Orders</h2>

    <p class="success-msg" th:if="${success}">Your order has been placed successfully!</p>

    <div th:if="${#lists.isEmpty(orders)}">
        <p>You haven't placed any orders yet. <a th:href="@{/}">Start shopping</a>.</p>
    </div>

    <div class="order-card" th:each="order : ${orders}">
        <div class="order-header">
            <span th:text="'Order #' + ${order.id}"></span>
            <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}"></span>
            <span class="order-status" th:text="${order.status}"></span>
        </div>
        <p th:text="'Deliver to: ' + ${order.deliveryAddress}"></p>
        <ul>
            <li th:each="item : ${order.items}"
                th:text="${item.productName} + ' × ' + ${item.quantity} + ' — ₹' + ${item.subtotal}"></li>
        </ul>
        <p class="order-total" th:text="'Total: ₹' + ${order.totalAmount}"></p>
    </div>
</div>

</body>
</html>
