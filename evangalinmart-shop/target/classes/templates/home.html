<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Evangalinmart - Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">
    <h2 th:if="${keyword}" th:text="'Search results for: ' + ${keyword}"></h2>
    <h2 th:unless="${keyword}">All Products</h2>

    <div class="product-grid">
        <div class="product-card" th:each="product : ${products}">
            <a th:href="@{'/product/' + ${product.id}}">
                <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty()} ? ${product.imageUrl} : 'https://via.placeholder.com/200x150?text=Evangalinmart'"
                     alt="Product image">
                <h3 th:text="${product.name}"></h3>
            </a>
            <p class="category" th:text="${product.category}"></p>
            <p class="price" th:text="'₹' + ${product.price}"></p>
            <p class="stock" th:if="${product.stockQuantity == 0}">Out of stock</p>

            <form th:action="@{/cart/add}" method="post" th:if="${product.stockQuantity > 0}">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="number" name="quantity" value="1" min="1" th:max="${product.stockQuantity}">
                <button type="submit">Add to Cart</button>
            </form>
        </div>

        <p th:if="${#lists.isEmpty(products)}">No products found.</p>
    </div>
</div>

</body>
</html>
